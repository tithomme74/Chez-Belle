# Ancien hébergement (Netlify), conservé seulement pour que l'ancienne adresse reste un site correct.
# L'hébergement actuel est Cloudflare Pages : voir src/_headers et functions/.
# Netlify construit le site avec Eleventy et publie le dossier _site
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# Espace d'administration : jamais indexé, jamais affiché dans un cadre, scripts du site seulement
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"

# Site public : protections de base (l'admin a en plus ses propres règles ci-dessus)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
